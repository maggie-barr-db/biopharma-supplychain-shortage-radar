resources:
  apps:
    radar_app:
      name: shortage-radar
      description: BioChain API shortage radar - disruption impact, mitigation approvals and Ask, on behalf of the signed-in user
      source_code_path: ../src/app
      user_api_scopes: [sql, dashboards.genie, genie, apps]
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: genie_supply_exposure
          genie_space:
            name: BioChain Supply Exposure
            space_id: ${resources.genie_spaces.supply_exposure.id}
            permission: CAN_RUN
        - name: lakebase
          postgres:
            branch: projects/shortage-radar/branches/production
            database: projects/shortage-radar/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE
